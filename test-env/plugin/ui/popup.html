<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能调度中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 340px;
  min-height: 420px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  padding: 16px;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
h1 { font-size: 16px; font-weight: 700; color: #58a6ff; }
.version { font-size: 10px; color: #484f58; }
.status-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 12px;
  font-size: 13px; font-weight: 600;
}
.status-row.running { background: #1a3a2a; color: #3fb950; }
.status-row.idle { background: #1c2128; color: #8b949e; }
.status-row.links-fail { background: #3a1a1a; color: #f85149; }
.status-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.running .status-dot { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
.idle .status-dot { background: #484f58; }
.links-fail .status-dot { background: #f85149; box-shadow: 0 0 6px #f85149; }
.section {
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}
.section-title {
  font-size: 11px; color: #8b949e; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
}
.stat-row {
  display: flex; justify-content: space-between;
  padding: 4px 0; font-size: 13px;
}
.stat-label { color: #8b949e; }
.stat-value { font-weight: 500; }
.stat-value.green { color: #3fb950; }
.stat-value.blue { color: #58a6ff; }
.stat-value.yellow { color: #d29922; }
.progress-bar {
  height: 6px; background: #21262d; border-radius: 3px;
  margin-top: 6px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #58a6ff, #3fb950);
  border-radius: 3px; transition: width 0.5s;
}
.engine-indicator {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600;
}
.engine-indicator.nurture { background: #1c2b36; color: #58a6ff; }
.engine-indicator.follow { background: #2b2416; color: #d29922; }
.engine-indicator.chat { background: #2a1a2a; color: #bc8cff; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn {
  flex: 1; padding: 10px 0; border: none; border-radius: 8px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all 0.2s;
}
.btn-start {
  background: linear-gradient(135deg, #238636, #2ea043);
  color: #fff;
}
.btn-start:hover { filter: brightness(1.15); }
.btn-start:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-pause {
  background: #21262d; color: #d29922; border: 1px solid #30363d;
}
.btn-pause:hover { background: #30363d; }
.btn-options {
  background: #21262d; color: #8b949e; border: 1px solid #30363d;
}
.btn-options:hover { background: #30363d; }
.footer {
  margin-top: 10px; font-size: 11px; color: #484f58;
  display: flex; justify-content: space-between;
}
.footer .link { color: #58a6ff; }
.refresh { font-size: 10px; color: #484f58; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<div class="header">
  <h1>智能调度中心</h1>
  <span class="version">v3</span>
</div>

<div id="statusRow" class="status-row idle">
  <div class="status-dot"></div>
  <span id="statusText">等待启动</span>
</div>

<div class="section">
  <div class="section-title">今日进度</div>
  <div class="stat-row">
    <span class="stat-label">关注</span>
    <span class="stat-value blue" id="followStat">-</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="followBar" style="width:0%"></div></div>
  <div class="stat-row" style="margin-top:6px">
    <span class="stat-label">私信（破冰/广告/催促）</span>
    <span class="stat-value" id="chatStat">-</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">养号（赞/评/转）</span>
    <span class="stat-value" id="nurtureStat">-</span>
  </div>
</div>

<div class="section">
  <div class="section-title">运行状态</div>
  <div class="stat-row">
    <span class="stat-label">当前引擎</span>
    <span class="engine-indicator nurture" id="engineBadge">--</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">推广链接</span>
    <span class="stat-value" id="linksStat">检查中...</span>
  </div>
  <div class="stat-row">
    <span class="stat-label">上海时间</span>
    <span class="stat-value" id="timeStat">--:--</span>
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-start" id="btnStart">启动</button>
  <button class="btn btn-pause" id="btnPause">暂停</button>
  <button class="btn btn-options" id="btnOptions">设置</button>
</div>

<div class="footer">
  <span id="footerMsg">就绪</span>
  <span class="link" id="btnRefresh">刷新</span>
</div>

<script src="popup.js"></script>
</body>
</html>
