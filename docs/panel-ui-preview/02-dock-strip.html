<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预览 02 · 短状态条</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at 70% 20%, rgba(35,134,54,.08), transparent 45%),
        #0d1117;
      color: #c9d1d9;
    }
    .page-hint {
      position: fixed; top: 16px; left: 16px; z-index: 1; max-width: 420px;
      font-size: 12px; color: #8b949e; line-height: 1.5;
      background: rgba(22,27,34,.9); border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px;
    }
    .page-hint a { color: #58a6ff; }
    .fake-x {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #30363d; font-size: 48px; font-weight: 700; pointer-events: none;
    }

    /* ===== 底部短状态条 ===== */
    #sg-dock {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      z-index: 10; width: min(520px, calc(100vw - 24px));
    }
    .dock-bar {
      display: flex; align-items: center; gap: 10px;
      background: rgba(13,17,23,.94); border: 1px solid #30363d; border-radius: 999px;
      padding: 6px 8px 6px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.45);
      backdrop-filter: blur(8px);
    }
    .dock-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #3fb950; flex-shrink: 0;
    }
    .dock-text { flex: 1; min-width: 0; font-size: 12px; color: #e6edf3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dock-text span { color: #8b949e; margin: 0 4px; }
    .dock-btn {
      border: none; border-radius: 999px; padding: 5px 12px; font-size: 11px; cursor: pointer;
      background: #da3633; color: #fff; flex-shrink: 0;
    }
    .dock-btn.stopped { background: #238636; }
    .dock-more {
      border: 1px solid #30363d; background: #161b22; color: #c9d1d9;
      border-radius: 999px; padding: 5px 10px; font-size: 11px; cursor: pointer; flex-shrink: 0;
    }
    .dock-more:hover { border-color: #58a6ff; color: #58a6ff; }

    .dock-drawer {
      display: none; margin-bottom: 8px;
      background: rgba(13,17,23,.96); border: 1px solid #30363d; border-radius: 12px;
      padding: 10px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.4);
    }
    #sg-dock.open .dock-drawer { display: block; }
    .drawer-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 11px; margin-bottom: 8px;
    }
    .drawer-grid .lbl { color: #8b949e; }
    .drawer-grid .val { color: #e6edf3; text-align: right; }
    .sg-toggles { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .sg-tog {
      font-size: 10px; border-radius: 4px; padding: 3px 6px; border: 1px solid #30363d;
      background: #21262d; color: #8b949e; cursor: pointer;
    }
    .sg-tog.on { color: #3fb950; border-color: rgba(63,185,80,.45); background: rgba(35,134,54,.15); }
    .sg-actions { display: flex; gap: 6px; }
    .sg-btn {
      flex: 1; font-size: 10px; padding: 5px 0; border-radius: 6px; cursor: pointer;
      border: 1px solid #30363d; background: #161b22; color: #c9d1d9;
    }
    .sg-btn:hover { border-color: #58a6ff; color: #58a6ff; }

    .modal-mask {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(1,4,9,.55); align-items: center; justify-content: center; padding: 16px;
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: min(360px, 100%); max-height: min(70vh, 480px);
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 13px; color: #e6edf3;
    }
    .modal-x { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; }
    .modal-bd { overflow: auto; padding: 8px 12px; flex: 1; }
    .log-item { font-size: 11px; padding: 7px 0; border-bottom: 1px solid #21262d; line-height: 1.4; }
    .log-item .t { color: #6e7681; margin-right: 6px; }
    .log-item.warn { color: #d29922; }
    .log-item.err { color: #f85149; }
    .modal-ft {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-top: 1px solid #21262d; font-size: 11px; color: #8b949e;
    }
    .modal-ft button {
      font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
      border: 1px solid #30363d; background: #0d1117; color: #c9d1d9;
    }
    .modal-ft button:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="page-hint">
    <strong>方案 02 · 短状态条</strong><br>
    底栏一行常驻；点「展开」出短抽屉；日志/配额弹窗翻页。
    <a href="index.html">← 返回索引</a>
  </div>
  <div class="fake-x">X</div>

  <div id="sg-dock">
    <div class="dock-drawer">
      <div class="drawer-grid">
        <div><span class="lbl">账号</span></div><div class="val">@demo_acct</div>
        <div><span class="lbl">今日关注</span></div><div class="val">12 / 47</div>
        <div><span class="lbl">私信</span></div><div class="val">歇 · 交友池</div>
        <div><span class="lbl">转帖</span></div><div class="val">1 / 2</div>
      </div>
      <div class="sg-toggles">
        <button type="button" class="sg-tog on">养号</button>
        <button type="button" class="sg-tog on">关注</button>
        <button type="button" class="sg-tog on">私信</button>
        <button type="button" class="sg-tog on">转帖</button>
      </div>
      <div class="sg-actions">
        <button type="button" class="sg-btn" data-open="quota">配额明细</button>
        <button type="button" class="sg-btn" data-open="logs">日志</button>
      </div>
    </div>
    <div class="dock-bar">
      <span class="dock-dot" id="dock-dot"></span>
      <div class="dock-text" id="dock-text">运行中 <span>·</span> 关注 <span>·</span> Day3 <span>·</span> 12/47</div>
      <button type="button" class="dock-btn" id="btn-run">停止</button>
      <button type="button" class="dock-more" id="btn-expand">展开</button>
    </div>
  </div>

  <div class="modal-mask" id="modal">
    <div class="modal">
      <div class="modal-hd">
        <span id="modal-title">日志</span>
        <button type="button" class="modal-x" id="modal-close">×</button>
      </div>
      <div class="modal-bd" id="modal-list"></div>
      <div class="modal-ft">
        <button type="button" id="pg-prev">上一页</button>
        <span id="pg-info">1 / 1</span>
        <button type="button" id="pg-next">下一页</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var PAGE = 8;
      var logs = [];
      for (var i = 1; i <= 40; i++) {
        var kind = i % 9 === 0 ? 'err' : (i % 5 === 0 ? 'warn' : '');
        var msg = kind === 'err' ? '关注点击未确认 #' + i
          : kind === 'warn' ? '轻总控短暂超时 #' + i
          : '已关注目标 user_' + (1000 + i);
        logs.push({ t: '00:' + String(60 - (i % 60)).padStart(2, '0'), msg: msg, kind: kind });
      }
      var quota = [
        { msg: '关注 12 / 47（Day3）' }, { msg: '私信：歇着 · dating' },
        { msg: '养号点赞今日 28' }, { msg: '转帖 1 / 2' },
        { msg: '来源 3 个' }, { msg: '引擎 coor · S3' },
        { msg: '资料克隆完成' }, { msg: '新号就绪' },
        { msg: 'OPS 192.168.0.100:15680' }, { msg: '号池 :15678' }
      ];

      var dock = document.getElementById('sg-dock');
      var expandBtn = document.getElementById('btn-expand');
      expandBtn.addEventListener('click', function () {
        var open = dock.classList.toggle('open');
        expandBtn.textContent = open ? '收起' : '展开';
      });
      var runBtn = document.getElementById('btn-run');
      runBtn.addEventListener('click', function () {
        var stopped = runBtn.classList.toggle('stopped');
        runBtn.textContent = stopped ? '启动' : '停止';
        document.getElementById('dock-text').innerHTML = stopped
          ? '已暂停 <span>·</span> 关注 <span>·</span> Day3 <span>·</span> 12/47'
          : '运行中 <span>·</span> 关注 <span>·</span> Day3 <span>·</span> 12/47';
        document.getElementById('dock-dot').style.background = stopped ? '#d29922' : '#3fb950';
      });
      document.querySelectorAll('.sg-tog').forEach(function (b) {
        b.addEventListener('click', function () { b.classList.toggle('on'); });
      });

      var modal = document.getElementById('modal');
      var listEl = document.getElementById('modal-list');
      var titleEl = document.getElementById('modal-title');
      var infoEl = document.getElementById('pg-info');
      var prevBtn = document.getElementById('pg-prev');
      var nextBtn = document.getElementById('pg-next');
      var items = logs, page = 0;

      function render() {
        var total = Math.max(1, Math.ceil(items.length / PAGE));
        if (page >= total) page = total - 1;
        if (page < 0) page = 0;
        var slice = items.slice(page * PAGE, page * PAGE + PAGE);
        listEl.innerHTML = slice.map(function (it) {
          return '<div class="log-item ' + (it.kind || '') + '">'
            + (it.t ? '<span class="t">' + it.t + '</span>' : '')
            + it.msg + '</div>';
        }).join('');
        infoEl.textContent = (page + 1) + ' / ' + total;
        prevBtn.disabled = page <= 0;
        nextBtn.disabled = page >= total - 1;
      }
      function openModal(m) {
        items = m === 'quota' ? quota : logs;
        titleEl.textContent = m === 'quota' ? '配额明细' : '运行日志';
        page = 0;
        modal.classList.add('open');
        render();
      }
      document.querySelectorAll('[data-open]').forEach(function (b) {
        b.addEventListener('click', function () { openModal(b.getAttribute('data-open')); });
      });
      document.getElementById('modal-close').onclick = function () { modal.classList.remove('open'); };
      modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('open'); });
      prevBtn.onclick = function () { page--; render(); };
      nextBtn.onclick = function () { page++; render(); };
    })();
  </script>
</body>
</html>
