<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预览 03 · 双圆钮改短</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at 80% 80%, rgba(88,166,255,.08), transparent 40%),
        #0d1117;
      color: #c9d1d9;
    }
    .page-hint {
      position: fixed; top: 16px; left: 16px; z-index: 1; max-width: 420px;
      font-size: 12px; color: #8b949e; line-height: 1.5;
      background: rgba(22,27,34,.9); border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px;
    }
    .page-hint a { color: #58a6ff; }
    .fake-x {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #30363d; font-size: 48px; font-weight: 700; pointer-events: none;
    }

    /* FAB — 贴近现网 */
    .sg-fab {
      position: fixed; z-index: 10; width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.35); border: 1.5px solid transparent; user-select: none;
    }
    .sg-fab-run {
      right: 16px; bottom: 52px;
      background: linear-gradient(135deg, #da3633, #f85149);
      border-color: rgba(248,81,73,.8); color: #fff; font-size: 11px;
    }
    .sg-fab-run.stopped {
      background: linear-gradient(135deg, #238636, #2ea043);
      border-color: rgba(63,185,80,.8);
    }
    .sg-fab-gear {
      right: 16px; bottom: 16px;
      background: rgba(13,17,23,.85); border-color: rgba(48,54,61,.9); color: #8b949e; font-size: 12px;
    }
    .sg-fab-gear.open { color: #58a6ff; border-color: rgba(88,166,255,.6); }

    /* 更矮的详情面板 */
    #sg-detail {
      display: none; position: fixed; right: 16px; bottom: 88px; width: 220px; z-index: 10;
      background: rgba(13,17,23,.96); border: 1px solid #30363d; border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,.45); overflow: hidden;
    }
    #sg-detail.open { display: block; }
    .sg-panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; border-bottom: 1px solid #21262d; font-size: 12px; color: #e6edf3;
    }
    .sg-panel-header .ver { color: #8b949e; font-size: 10px; }
    .sg-panel-body { padding: 8px 10px 10px; }
    .sg-row {
      display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0;
    }
    .sg-row .lbl { color: #8b949e; }
    .sg-row .val { color: #e6edf3; }
    .sg-bar {
      height: 4px; background: #21262d; border-radius: 99px; margin: 4px 0 6px; overflow: hidden;
    }
    .sg-bar > i { display: block; height: 100%; width: 26%; background: #238636; }
    .hint-short {
      font-size: 10px; color: #6e7681; margin: 4px 0 8px; line-height: 1.4;
    }
    .sg-actions { display: flex; gap: 6px; }
    .sg-btn {
      flex: 1; font-size: 10px; padding: 5px 0; border-radius: 6px; cursor: pointer;
      border: 1px solid #30363d; background: #161b22; color: #c9d1d9;
    }
    .sg-btn:hover { border-color: #58a6ff; color: #58a6ff; }

    .modal-mask {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(1,4,9,.55); align-items: center; justify-content: center; padding: 16px;
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: min(360px, 100%); max-height: min(70vh, 480px);
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 13px; color: #e6edf3;
    }
    .modal-x { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; }
    .modal-bd { overflow: auto; padding: 8px 12px; flex: 1; }
    .log-item { font-size: 11px; padding: 7px 0; border-bottom: 1px solid #21262d; line-height: 1.4; }
    .log-item .t { color: #6e7681; margin-right: 6px; }
    .log-item.warn { color: #d29922; }
    .log-item.err { color: #f85149; }
    .modal-ft {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-top: 1px solid #21262d; font-size: 11px; color: #8b949e;
    }
    .modal-ft button {
      font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
      border: 1px solid #30363d; background: #0d1117; color: #c9d1d9;
    }
    .modal-ft button:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="page-hint">
    <strong>方案 03 · 双圆钮改短</strong><br>
    点齿轮开/关短面板；长内容只在弹窗翻页（比现网详情矮一截）。
    <a href="index.html">← 返回索引</a>
  </div>
  <div class="fake-x">X</div>

  <div id="sg-detail">
    <div class="sg-panel-header">
      <span>智能调度</span>
      <span class="ver">preview</span>
    </div>
    <div class="sg-panel-body">
      <div class="sg-row"><span class="lbl">状态</span><span class="val" id="st-val">运行 · 关注</span></div>
      <div class="sg-row"><span class="lbl">今日关注</span><span class="val">12 / 47</span></div>
      <div class="sg-bar"><i></i></div>
      <div class="sg-row"><span class="lbl">账号</span><span class="val">@demo_acct · Day3</span></div>
      <div class="sg-row"><span class="lbl">转帖</span><span class="val">1 / 2</span></div>
      <p class="hint-short">明细与日志不堆在面板里，点下面进弹窗翻页。</p>
      <div class="sg-actions">
        <button type="button" class="sg-btn" data-open="quota">配额</button>
        <button type="button" class="sg-btn" data-open="logs">日志</button>
        <button type="button" class="sg-btn" data-open="settings">设置</button>
      </div>
    </div>
  </div>

  <div class="sg-fab sg-fab-run" id="btn-run" title="启停">❚❚</div>
  <div class="sg-fab sg-fab-gear" id="btn-gear" title="详情">⚙</div>

  <div class="modal-mask" id="modal">
    <div class="modal">
      <div class="modal-hd">
        <span id="modal-title">日志</span>
        <button type="button" class="modal-x" id="modal-close">×</button>
      </div>
      <div class="modal-bd" id="modal-list"></div>
      <div class="modal-ft">
        <button type="button" id="pg-prev">上一页</button>
        <span id="pg-info">1 / 1</span>
        <button type="button" id="pg-next">下一页</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var PAGE = 8;
      var logs = [];
      for (var i = 1; i <= 40; i++) {
        var kind = i % 9 === 0 ? 'err' : (i % 5 === 0 ? 'warn' : '');
        var msg = kind === 'err' ? '关注点击未确认 #' + i
          : kind === 'warn' ? '轻总控短暂超时 #' + i
          : '已关注目标 user_' + (1000 + i);
        logs.push({ t: '00:' + String(60 - (i % 60)).padStart(2, '0'), msg: msg, kind: kind });
      }
      var quota = [
        { msg: '关注 12 / 47（Day3）' }, { msg: '私信：歇着 · dating' },
        { msg: '养号点赞今日 28' }, { msg: '转帖 1 / 2 · 来源 3' },
        { msg: '引擎 coor · S3' }, { msg: '资料克隆完成' },
        { msg: '新号就绪' }, { msg: 'OPS :15680' },
        { msg: '号池 :15678' }, { msg: '模块开关：全开（预览）' }
      ];
      var settings = [
        { msg: 'OPS 地址：192.168.0.100:15680' },
        { msg: '号池地址：192.168.0.100:15678' },
        { msg: '养号模块：ON' }, { msg: '关注模块：ON' },
        { msg: '私信模块：ON' }, { msg: '转帖模块：ON' },
        { msg: '媒体加载：on' }, { msg: '话术池：dating' },
        { msg: '（预览页，改动不落盘）' }
      ];

      var detail = document.getElementById('sg-detail');
      var gear = document.getElementById('btn-gear');
      gear.addEventListener('click', function () {
        var open = detail.classList.toggle('open');
        gear.classList.toggle('open', open);
      });
      var runBtn = document.getElementById('btn-run');
      runBtn.addEventListener('click', function () {
        var stopped = runBtn.classList.toggle('stopped');
        runBtn.textContent = stopped ? '▶' : '❚❚';
        document.getElementById('st-val').textContent = stopped ? '暂停 · 关注' : '运行 · 关注';
      });

      var modal = document.getElementById('modal');
      var listEl = document.getElementById('modal-list');
      var titleEl = document.getElementById('modal-title');
      var infoEl = document.getElementById('pg-info');
      var prevBtn = document.getElementById('pg-prev');
      var nextBtn = document.getElementById('pg-next');
      var items = logs, page = 0;
      var titles = { logs: '运行日志', quota: '配额明细', settings: '设置' };

      function render() {
        var total = Math.max(1, Math.ceil(items.length / PAGE));
        if (page >= total) page = total - 1;
        if (page < 0) page = 0;
        var slice = items.slice(page * PAGE, page * PAGE + PAGE);
        listEl.innerHTML = slice.map(function (it) {
          return '<div class="log-item ' + (it.kind || '') + '">'
            + (it.t ? '<span class="t">' + it.t + '</span>' : '')
            + it.msg + '</div>';
        }).join('');
        infoEl.textContent = (page + 1) + ' / ' + total;
        prevBtn.disabled = page <= 0;
        nextBtn.disabled = page >= total - 1;
      }
      function openModal(m) {
        items = m === 'quota' ? quota : (m === 'settings' ? settings : logs);
        titleEl.textContent = titles[m] || '详情';
        page = 0;
        modal.classList.add('open');
        render();
      }
      document.querySelectorAll('[data-open]').forEach(function (b) {
        b.addEventListener('click', function () { openModal(b.getAttribute('data-open')); });
      });
      document.getElementById('modal-close').onclick = function () { modal.classList.remove('open'); };
      modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('open'); });
      prevBtn.onclick = function () { page--; render(); };
      nextBtn.onclick = function () { page++; render(); };
    })();
  </script>
</body>
</html>
